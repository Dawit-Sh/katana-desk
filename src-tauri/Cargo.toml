[package]
name = "katana-desk"
version = "0.1.0"
description = "Katana Desk, the desktop version of Katana"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dawit-Sh/katana-desk"
edition = "2021"

[lib]
name = "katana_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-decorum = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
notify = "8"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
md-5 = "0.10"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2 = "1"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
